name: Build & Deploy

on:
  push:
    branches: [main]

env:
  SERVICE: passwordgenerator

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.SERVICE }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Desplegar en el VPS
        run: |
          install -m 600 /dev/null key
          echo "${{ secrets.VPS_SSH_KEY }}" > key
          echo "${{ secrets.VPS_KNOWN_HOST }}" > known_hosts
          ssh -i key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes \
            deploy@${{ secrets.VPS_HOST }} "${{ env.SERVICE }}"
